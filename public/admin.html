<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel Admin – Triple O</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 0 auto;
      padding: 20px;
      background: #f0f8f0;
      color: #1f1f1f;
    }
    h1, h2 { color: #006400; margin-top: 0; }
    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    label { display: block; font-weight: bold; margin: 12px 0 5px; }
    input, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #cfd8cf;
      border-radius: 8px;
      font-size: 15px;
    }
    textarea { min-height: 80px; resize: vertical; }
    button {
      background: #28a745;
      color: white;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover { background: #218838; }
    .btn-danger { background: #b42318; }
    .btn-danger:hover { background: #912018; }
    .btn-secondary { background: #5f6f5f; }
    .btn-secondary:hover { background: #4f5d4f; }
    .btn-sm { padding: 6px 12px; font-size: 13px; margin: 4px 0; }
    #loginSection { text-align: center; max-width: 380px; margin: 80px auto; }
    #loginSection input { text-align: center; font-size: 17px; }
    #loginSection button { width: 100%; font-size: 17px; }
    #mainSection { display: none; }
    .evento-card {
      border: 1px solid #dbe8db;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      background: #fcfffc;
    }
    .evento-card.inactivo { opacity: 0.6; }
    .evento-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
    .evento-title { font-size: 18px; font-weight: bold; color: #006400; }
    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }
    .badge-green { background: #d1fae5; color: #065f46; }
    .badge-gray { background: #e5e7eb; color: #6b7280; }
    .stats-row { display: flex; gap: 20px; margin: 12px 0; flex-wrap: wrap; }
    .stat { text-align: center; }
    .stat-val { font-size: 22px; font-weight: bold; color: #006400; }
    .stat-label { font-size: 12px; color: #666; }
    .qr-area { display: flex; align-items: center; gap: 20px; margin-top: 12px; flex-wrap: wrap; }
    .link-box {
      background: #f0f8f0;
      border: 1px solid #dbe8db;
      border-radius: 8px;
      padding: 8px 12px;
      font-family: monospace;
      font-size: 13px;
      word-break: break-all;
    }
    .qr-new {
      border: 2px solid #006400;
      border-radius: 12px;
      padding: 20px;
      background: #f7fbf7;
      margin-top: 16px;
      display: none;
    }
    .qr-new img { display: block; margin: 10px 0; border-radius: 8px; }
    .error { color: #b42318; font-size: 14px; margin-top: 8px; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    #loadingMsg { color: #666; font-style: italic; }
  </style>
</head>
<body>

  <div id="loginSection" class="card">
    <h1>Panel Admin</h1>
    <p style="color:#555;">Introduce la contraseña de administrador para continuar.</p>
    <label for="pwdInput">Contraseña</label>
    <input type="password" id="pwdInput" placeholder="••••••••••" />
    <div id="loginError" class="error"></div>
    <button onclick="doLogin()">Entrar</button>
  </div>

  <div id="mainSection">
    <div style="text-align:center; margin-bottom:20px;">
      <img src="/logo-017.svg" alt="Logo O17" style="height:80px; width:auto;">
      <h1 style="margin:8px 0 0;">Panel Admin – Triple O</h1>
    </div>

    <div class="card">
      <h2>Crear nuevo evento</h2>
      <label for="nombreEvento">Nombre del evento *</label>
      <input type="text" id="nombreEvento" placeholder="Ej: Cumbre Sostenibilidad 2025" />
      <label for="descEvento">Descripción (opcional)</label>
      <textarea id="descEvento" placeholder="Breve descripción del evento"></textarea>
      <button onclick="crearEvento()">Crear evento y generar QR</button>
      <div id="createError" class="error"></div>

      <div id="qrNuevo" class="qr-new">
        <strong>Evento creado con éxito</strong>
        <div id="codigoNuevo" style="font-size:20px; font-weight:bold; color:#006400; margin:8px 0;"></div>
        <img id="qrImgNueva" src="" alt="QR" width="200" />
        <div id="urlNueva" class="link-box"></div>
        <div class="actions">
          <a id="qrDownloadLink" download="qr-evento.png">
            <button class="btn-secondary btn-sm">Descargar QR</button>
          </a>
          <a id="eventoPublicLink" target="_blank">
            <button class="btn-secondary btn-sm">Ver resumen del evento</button>
          </a>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>Eventos creados</h2>
      <button class="btn-secondary btn-sm" onclick="cargarEventos()" style="margin-bottom:12px;">Actualizar lista</button>
      <div id="loadingMsg">Cargando...</div>
      <div id="listaEventos"></div>
    </div>
  </div>

  <script>
    let adminPwd = "";

    function doLogin() {
      const pwd = document.getElementById("pwdInput").value.trim();
      if (!pwd) {
        document.getElementById("loginError").textContent = "Introduce la contraseña.";
        return;
      }
      adminPwd = pwd;
      cargarEventos();
    }

    document.getElementById("pwdInput").addEventListener("keydown", e => {
      if (e.key === "Enter") doLogin();
    });

    async function crearEvento() {
      const nombre = document.getElementById("nombreEvento").value.trim();
      const descripcion = document.getElementById("descEvento").value.trim();
      const errEl = document.getElementById("createError");
      errEl.textContent = "";

      if (!nombre) {
        errEl.textContent = "El nombre del evento es obligatorio.";
        return;
      }

      try {
        const res = await fetch("/api/admin/evento", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-Admin-Key": adminPwd
          },
          body: JSON.stringify({ nombre, descripcion })
        });

        if (res.status === 401) {
          errEl.textContent = "Contraseña incorrecta.";
          return;
        }

        const data = await res.json();
        if (!res.ok) {
          errEl.textContent = data.error || "Error al crear el evento.";
          return;
        }

        const { evento, qrDataUrl, participantUrl } = data;

        document.getElementById("codigoNuevo").textContent = `Código: ${evento.codigo}`;
        document.getElementById("qrImgNueva").src = qrDataUrl;
        document.getElementById("urlNueva").textContent = participantUrl;

        const dlLink = document.getElementById("qrDownloadLink");
        dlLink.href = qrDataUrl;
        dlLink.download = `qr-${evento.codigo}.png`;

        document.getElementById("eventoPublicLink").href = `/evento.html?codigo=${evento.codigo}`;
        document.getElementById("qrNuevo").style.display = "block";

        document.getElementById("nombreEvento").value = "";
        document.getElementById("descEvento").value = "";

        cargarEventos();
      } catch (err) {
        errEl.textContent = "Error de red: " + err.message;
      }
    }

    async function cargarEventos() {
      const loadEl = document.getElementById("loadingMsg");
      const listaEl = document.getElementById("listaEventos");
      loadEl.textContent = "Cargando...";
      listaEl.innerHTML = "";

      try {
        const res = await fetch("/api/admin/eventos", {
          headers: { "X-Admin-Key": adminPwd }
        });

        if (res.status === 401) {
          document.getElementById("loginError").textContent = "Contraseña incorrecta.";
          loadEl.textContent = "";
          return;
        }

        const eventos = await res.json();
        loadEl.textContent = "";

        if (!res.ok) {
          loadEl.textContent = eventos.error || "Error al cargar eventos.";
          return;
        }

        document.getElementById("loginSection").style.display = "none";
        document.getElementById("mainSection").style.display = "block";

        if (!eventos.length) {
          listaEl.innerHTML = "<p style='color:#666;'>No hay eventos creados todavía.</p>";
          return;
        }

        listaEl.innerHTML = eventos.map(e => {
          const fecha = new Date(e.fecha_creacion).toLocaleDateString("es-ES", {
            year: "numeric", month: "long", day: "numeric"
          });
          const avgKg = e.participantes > 0
            ? Math.round(e.totalKg / e.participantes * 100) / 100
            : 0;

          return `
            <div class="evento-card ${e.activo ? "" : "inactivo"}" id="card-${e.codigo}">
              <div class="evento-header">
                <div>
                  <div class="evento-title">${e.nombre}</div>
                  <div style="font-size:13px; color:#666;">Código: <strong>${e.codigo}</strong> · Creado: ${fecha}</div>
                  ${e.descripcion ? `<div style="margin-top:6px; font-size:14px;">${e.descripcion}</div>` : ""}
                </div>
                <span class="badge ${e.activo ? "badge-green" : "badge-gray"}">${e.activo ? "Activo" : "Inactivo"}</span>
              </div>

              <div class="stats-row">
                <div class="stat">
                  <div class="stat-val">${e.participantes}</div>
                  <div class="stat-label">Participantes</div>
                </div>
                <div class="stat">
                  <div class="stat-val">${e.totalKg} kg</div>
                  <div class="stat-label">Total CO₂e</div>
                </div>
                <div class="stat">
                  <div class="stat-val">${avgKg} kg</div>
                  <div class="stat-label">Media por persona</div>
                </div>
              </div>

              <div class="qr-area" id="qr-area-${e.codigo}">
                <div>
                  <button class="btn-secondary btn-sm" onclick="mostrarQR('${e.codigo}')">Ver / Descargar QR</button>
                </div>
                <div>
                  <div class="link-box">${e.participantUrl}</div>
                </div>
              </div>
              <div id="qr-img-${e.codigo}"></div>

              <div class="actions">
                <a href="/evento.html?codigo=${e.codigo}" target="_blank">
                  <button class="btn-secondary btn-sm">Ver resumen público</button>
                </a>
                <button class="btn-sm ${e.activo ? "btn-danger" : ""}"
                  onclick="toggleEvento('${e.codigo}', ${!e.activo})">
                  ${e.activo ? "Desactivar" : "Activar"}
                </button>
              </div>
            </div>
          `;
        }).join("");

      } catch (err) {
        loadEl.textContent = "Error de red: " + err.message;
      }
    }

    async function mostrarQR(codigo) {
      const container = document.getElementById(`qr-img-${codigo}`);
      if (container.innerHTML) {
        container.innerHTML = "";
        return;
      }
      container.innerHTML = "<p style='font-size:13px; color:#666;'>Cargando QR...</p>";

      try {
        const res = await fetch(`/api/admin/evento/${codigo}/qr`, {
          headers: { "X-Admin-Key": adminPwd }
        });
        const data = await res.json();

        if (!res.ok) {
          container.innerHTML = `<p class='error'>${data.error}</p>`;
          return;
        }

        container.innerHTML = `
          <div style="margin-top:12px;">
            <img src="${data.qrDataUrl}" width="180" style="border-radius:8px; border:1px solid #ddd;" />
            <br>
            <a href="${data.qrDataUrl}" download="qr-${codigo}.png">
              <button class="btn-secondary btn-sm" style="margin-top:8px;">Descargar QR</button>
            </a>
          </div>
        `;
      } catch (err) {
        container.innerHTML = `<p class='error'>${err.message}</p>`;
      }
    }

    async function toggleEvento(codigo, nuevoEstado) {
      try {
        const res = await fetch(`/api/admin/evento/${codigo}`, {
          method: "PATCH",
          headers: {
            "Content-Type": "application/json",
            "X-Admin-Key": adminPwd
          },
          body: JSON.stringify({ activo: nuevoEstado })
        });
        if (!res.ok) {
          const data = await res.json();
          alert(data.error || "Error al actualizar el evento.");
          return;
        }
        cargarEventos();
      } catch (err) {
        alert("Error de red: " + err.message);
      }
    }
  </script>
</body>
</html>
